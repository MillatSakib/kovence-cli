name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - "website/**"
            - "docs/**"
            - "*.md"
            - ".gitignore"
            - ".prettierignore"
    pull_request:
        branches: [main]
        paths-ignore:
            - "website/**"
            - "docs/**"
            - "*.md"
            - ".gitignore"
            - ".prettierignore"

jobs:
    test:
        name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                node-version: [20, 22]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install devDependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Typecheck
              run: npm run typecheck

            - name: Syntax check
              run: npm run check

            - name: Run unit and integration tests
              run: npm test
